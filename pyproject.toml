[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "opsmind"
version = "0.1.0"
description = "Enterprise equipment maintenance agent — built incrementally"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = ["pydantic-settings>=2.7,<3"]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/opsmind"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
