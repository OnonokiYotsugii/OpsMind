[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "opsmind"
version = "0.1.0"
description = "Enterprise equipment maintenance agent — built incrementally"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pydantic-settings>=2.7,<3",
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "sqlalchemy>=2.0,<2.1",
    "pymysql[rsa]>=1.1,<2",
    "alembic>=1.14,<2",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.9,<1", "httpx>=0.28,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/opsmind"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires a dedicated MySQL test database"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

